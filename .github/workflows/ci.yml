name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Check system contracts
        run: node scripts/check_system.js

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-credential
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-credential
          CRON_SECRET: ci-placeholder-not-a-credential
          GEMINI_API_KEY: ""
          GOOGLE_CLIENT_ID: ""
          GOOGLE_CLIENT_SECRET: ""
          GOOGLE_REFRESH_TOKEN: ""
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ""
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ""

      - name: Install Chromium for accessibility tests
        run: npx playwright install --with-deps chromium

      - name: Check public-page accessibility
        run: npm run test:a11y
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3200
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: accessibility-test-placeholder
